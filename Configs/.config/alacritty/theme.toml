  GNU nano 8.4                                                                      theme.toml
# Alacritty Theme: Catppuccin Mocha 🌿
# Adapted from Kitty theme
# Author: Catppuccin Org (https://github.com/catppuccin)

[colors]

# Basic colors
primary = { background = "#1e1e2e", foreground = "#cdd6f4" }

# Selection
selection = { text = "#1e1e2e", background = "#f5e0dc" }

# Cursor
cursor = { text = "#1e1e2e", cursor = "#f5e0dc" }

# Normal colors
[colors.normal]
black   = "#45475a"  # color0
red     = "#f38ba8"  # color1
green   = "#a6e3a1"  # color2
yellow  = "#f9e2af"  # color3
blue    = "#89b4fa"  # color4
magenta = "#f5c2e7"  # color5
cyan    = "#94e2d5"  # color6
white   = "#bac2de"  # color7

# Bright colors
[colors.bright]
black   = "#585b70"  # color8
red     = "#f38ba8"  # color9
green   = "#a6e3a1"  # color10
yellow  = "#f9e2af"  # color11
blue    = "#89b4fa"  # color12
magenta = "#f5c2e7"  # color13
cyan    = "#94e2d5"  # color14
white   = "#a6adc8"  # color15

# Optional: search and vi mode colors for extra polish
[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"
